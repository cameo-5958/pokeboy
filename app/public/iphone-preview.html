<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokeboy iPhone Previews</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #202027;
        color: #f4f4f6;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100%;
      }

      .previews {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 32px;
        box-sizing: border-box;
      }

      .phone {
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #0b0b0f;
        border: 12px solid #111116;
        border-radius: 46px;
        box-shadow: 0 24px 80px rgb(0 0 0 / 0.45);
      }

      .phone.landscape {
        width: 844px;
        height: 390px;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 1360px), (max-height: 920px) {
        .previews {
          transform: scale(0.82);
        }
      }

      @media (max-width: 1120px) {
        .previews {
          flex-direction: column;
          transform: none;
          padding: 24px;
        }

        .phone.landscape {
          width: min(844px, calc(100vw - 48px));
          height: min(390px, calc((100vw - 48px) * 0.462));
        }
      }

      @media (max-width: 430px) {
        .previews {
          display: block;
          padding: 0;
        }

        .phone {
          width: 100vw;
          height: 100vh;
          border: 0;
          border-radius: 0;
          transform: none;
        }

        .phone.landscape {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="previews" aria-label="iPhone preview frames">
      <section class="phone" aria-label="iPhone 15 portrait preview frame">
        <iframe src="/" title="Pokeboy app portrait preview"></iframe>
      </section>
      <section class="phone landscape" aria-label="iPhone 15 landscape preview frame">
        <iframe src="/" title="Pokeboy app landscape preview"></iframe>
      </section>
    </main>
  </body>
</html>
