<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#c8d4a4}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      padding:12px;color:#344637;font:10px monospace;text-align:center}
  </style>
</head>
<body>
  <canvas id="screen" width="160" height="144"></canvas>
  <div id="status">LOADING</div>
  <script>
  (async () => {
    const runtime=window.PokeboyRuntime;
    if(!runtime)throw new Error('Native emulator configuration is missing');
    function loadScript(uri){
      return new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src=uri;script.onload=resolve;script.onerror=()=>reject(new Error('Unable to load bundled emulator script: '+uri));
        document.head.appendChild(script);
      });
    }
    await loadScript(runtime.gbcoreUri);
    await loadScript(runtime.modCoreUri);
    const apiUrl=path=>runtime.backendUrl+path;
    const W=160,H=144,FRAME_MS=1000/59.7275,MAX_CATCHUP_FRAMES=4,AUDIO_MAX_FRAMES=4096;
    const palette=new Uint8ClampedArray([
      200,212,164,255, 143,168,120,255, 78,99,80,255, 28,43,34,255
    ]);
    const canvas=document.getElementById('screen');
    const status=document.getElementById('status');
    const ctx=canvas.getContext('2d',{alpha:false});
    const image=ctx.createImageData(W,H);
    let Module,gb,api,input={buttons:0,dpad:0},speed=1;
    let acc=0,lastT=0,rafId=0,running=false,started=false,userPaused=false,modsBusy=0;
    let cartridgeId='',cartridgeVersion='',desiredMods=[],modUpdate=Promise.resolve(),requestOptions={};
    let modVersions=new Map();
    let audioPtr=0,muted=false,volume=1;
    const loadedMods=new Map();
    const modHandlers=new Map();
    let hostError=null,hostCallback=0;
    let saveDataWaiter=null,saveReady=false,saveNonce=null,mirrorBlocked=false,hasPersisted=false;
    let stateBusy=false; // a state snapshot/restore is in flight
    let telemetry=false,telTimer=0,rafCount=0,frameCount=0;
    let bootStage='script-start';

    function notify(type,detail){
      window.ReactNativeWebView?.postMessage(JSON.stringify({type,detail}));
    }
    function errorDetail(error,stage=bootStage){
      const value=error instanceof Error?error:new Error(String(error));
      const detail={message:value.message,name:value.name||'Error',stack:value.stack||null,stage};
      for(const key of ['operation','status','decodeError']){
        if(value[key]!==undefined)detail[key]=value[key];
      }
      return detail;
    }
    function reportError(error,stage){
      const detail=errorDetail(error,stage);
      notify('error',detail);
      return detail;
    }
    function receive(raw){
      try {
        const msg=typeof raw==='string'?JSON.parse(raw):raw;
        if(msg.type==='input'){
          input=msg;
          if(gb) api.setInput(gb,input.buttons|0,input.dpad|0);
        } else if(msg.type==='settings') {
          const prevSpeed=speed;
          speed=msg.speed==='inf'?Infinity:Math.min(8,Math.max(.5,Number(msg.speed)||1));
          if(prevSpeed===1&&speed!==1)AudioSystem.clear(); // drop queued 1x audio so it can't play stale later
          muted=Boolean(msg.muted);
          volume=Math.max(0,Math.min(1,Number(msg.volume)||0));
          AudioSystem.setVolume(muted?0:volume);
          if(typeof msg.battleLinkEndpoint==='string'){
            runtime.battleLinkEndpoint=msg.battleLinkEndpoint.trim();
          }
          AudioSystem.resume().catch(()=>{});
          const tel=Boolean(msg.telemetry);
          if(tel!==telemetry){
            telemetry=tel;
            if(tel){rafCount=0;frameCount=0;telTimer=setInterval(sampleTelemetry,1000)}
            else{clearInterval(telTimer);telTimer=0;rafCount=0;frameCount=0}
          }
        } else if(msg.type==='paused') {
          userPaused=Boolean(msg.value);
          if(userPaused){persistSave();pauseEmulation()}else resumeEmulation();
        } else if(msg.type==='mods') {
          desiredMods=Array.isArray(msg.ids)?msg.ids.filter(id=>typeof id==='string'):[];
          modUpdate=modUpdate.then(reconcileMods).catch(error=>reportError(error,'mods-reconcile'));
        } else if(msg.type==='dev-frame') {
          // Dev mode: hand the host a PNG of the LCD framebuffer (an OS
          // screenshot can't capture the WebView surface).
          notify('dev-frame',{nonce:msg.nonce,png:canvas.toDataURL('image/png')});
        } else if(msg.type==='save-data' && msg.id===cartridgeId && saveNonce && msg.nonce===saveNonce) {
          saveNonce=null;
          if(saveDataWaiter){const resolve=saveDataWaiter;saveDataWaiter=null;resolve(msg)}
          else lateSaveData(msg); // host answered after the handshake timeout
        } else if(msg.type==='state-save') {
          // Save state = snapshot of the whole WASM heap. The copy is taken
          // synchronously so no frame can interleave; compression is async.
          if(!started||modsBusy||stateBusy){notify('state-error',{nonce:msg.nonce,message:'EMULATOR BUSY'})}
          else{
            const heap=Module.HEAPU8.slice();
            stateBusy=true;
            encodeState(heap,msg.nonce).finally(()=>{stateBusy=false});
          }
        } else if(msg.type==='state-load') {
          if(!started||modsBusy||stateBusy){notify('state-error',{nonce:msg.nonce,message:'EMULATOR BUSY'})}
          else{stateBusy=true;applyState(msg).finally(()=>{stateBusy=false})}
        }
      } catch(error){ reportError(error,'host-message'); }
    }
    function openRomCache(){
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open('pokeboy',2);
        request.onupgradeneeded=()=>{
          for(const name of ['roms','payloads','metadata']){
            if(!request.result.objectStoreNames.contains(name))request.result.createObjectStore(name);
          }
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
    }
    async function fetchRom(id){
      const response=await fetch(apiUrl('/api/cartridges/'+encodeURIComponent(id)+'/rom'),requestOptions);
      if(!response.ok)throw new Error(response.status===404?'ROM NOT INSTALLED':'ROM LOAD FAILED');
      return response.arrayBuffer();
    }
    async function localFirstJson(key,path){
      let db=null,local=null;
      try{
        db=await openRomCache();
        local=await new Promise((resolve,reject)=>{
          const request=db.transaction('metadata').objectStore('metadata').get(key);
          request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
        });
      }catch(error){db?.close();db=null;notify('cache-error',String(error))}
      try{
        const response=await fetch(apiUrl(path),requestOptions);
        if(!response.ok)throw new Error('API request failed ('+response.status+')');
        const remote=await response.json();
        if(db)try{
          await new Promise((resolve,reject)=>{
            const request=db.transaction('metadata','readwrite').objectStore('metadata').put(remote,key);
            request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error);
          });
        }catch(error){notify('cache-error',String(error))}
        db?.close();return remote;
      }catch(error){
        db?.close();if(local!==null)return local;throw error;
      }
    }
    async function localFirstPayload(key,path,missingMessage){
      let db=null;
      try{
        try{
          db=await openRomCache();
          const local=await new Promise((resolve,reject)=>{
            const request=db.transaction('payloads').objectStore('payloads').get(key);
            request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
          });
          if(local){notify('payload-source',{key,source:'local'});return new Uint8Array(local)}
        }catch(error){db?.close();db=null;notify('cache-error',String(error))}
        const response=await fetch(apiUrl(path),requestOptions);
        if(!response.ok)throw new Error(missingMessage);
        const buffer=await response.arrayBuffer();
        if(db)try{
          await new Promise((resolve,reject)=>{
            const request=db.transaction('payloads','readwrite').objectStore('payloads').put(buffer,key);
            request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error);
          });
        }catch(error){notify('cache-error',String(error))}
        notify('payload-source',{key,source:'api'});return new Uint8Array(buffer);
      }finally{db?.close()} // IDBDatabase.close() is a no-op when already closed
    }
    function evictStoreKeys(db,name,live){
      return new Promise((resolve,reject)=>{
        const transaction=db.transaction(name,'readwrite');
        const store=transaction.objectStore(name);
        const request=store.getAllKeys();
        request.onsuccess=()=>{
          for(const key of request.result)if(!live.has(key))store.delete(key);
        };
        request.onerror=()=>reject(request.error);
        transaction.oncomplete=()=>resolve();
        transaction.onerror=()=>reject(transaction.error);
        transaction.onabort=()=>reject(transaction.error);
      });
    }
    async function evictStaleCache(registry){
      let db=null;
      try{
        const roms=registry.roms||[],mods=registry.mods||[];
        const liveRoms=new Set(roms.map(rom=>rom.id+'@'+rom.version));
        const livePayloads=new Set([
          ...mods.map(mod=>'mod:'+mod.id+'@'+mod.version),
          ...roms.map(rom=>'symbols:'+rom.id+'@'+rom.version)
        ]);
        db=await openRomCache();
        await Promise.all([
          evictStoreKeys(db,'roms',liveRoms),
          evictStoreKeys(db,'payloads',livePayloads)
        ]);
      }catch(error){notify('cache-error',String(error))}
      finally{db?.close()}
    }
    async function cachedRom(id,version){
      const key=id+'@'+version;
      let db=null;
      try{
        try{
          db=await openRomCache();
          const local=await new Promise((resolve,reject)=>{
            const request=db.transaction('roms').objectStore('roms').get(key);
            request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
          });
          if(local){notify('rom-source','local');return new Uint8Array(local)}
        }catch(error){
          db?.close();db=null;notify('cache-error',String(error));
        }
        const buffer=await fetchRom(id);
        if(db)try{
          await new Promise((resolve,reject)=>{
            const request=db.transaction('roms','readwrite').objectStore('roms').put(buffer,key);
            request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error);
          });
        }catch(error){
          notify('cache-error',String(error));
        }
        notify('rom-source','api');return new Uint8Array(buffer);
      }finally{db?.close()} // IDBDatabase.close() is a no-op when already closed
    }
    const AudioSystem=(()=>{
      let ctx=null,node=null,mode=null,master=null,workletBacklog=0;
      const resampler={pos:0,lastL:0,lastR:0};
      const spQueue=[]; // ScriptProcessor fallback: array of {L,R,offset}
      function setVolume(v){ if(master)master.gain.value=v; }
      function resample(inL,inR,n,outRate){
        if(!outRate||Math.round(outRate)===44100)return{L:inL,R:inR,n};
        const ratio=44100/outRate,outL=[],outR=[];
        let pos=resampler.pos;
        while(true){
          const idx=Math.floor(pos);
          if(idx>=n-1)break;
          const frac=pos-idx;
          const l0=idx<0?resampler.lastL:inL[idx],l1=inL[idx+1];
          const r0=idx<0?resampler.lastR:inR[idx],r1=inR[idx+1];
          outL.push(l0+(l1-l0)*frac);
          outR.push(r0+(r1-r0)*frac);
          pos+=ratio;
        }
        resampler.pos=Math.max(0,pos-(n-1));
        if(n>0){resampler.lastL=inL[n-1];resampler.lastR=inR[n-1]}
        return{L:Float32Array.from(outL),R:Float32Array.from(outR),n:outL.length};
      }
      const WORKLET_SRC=[
        "class GBProcessor extends AudioWorkletProcessor {",
        "  constructor(){",
        "    super();",
        "    this.qL = []; this.qR = []; this.qLen = 0; this.qOff = 0;",
        "    this.port.onmessage = (e) => {",
        "      if(e.data.stat){ this.port.postMessage({qLen:this.qLen}); return; }", // qLen is already the remaining unplayed count (decremented per consumed sample)
        "      if(e.data.clear){ this.qL.length = 0; this.qR.length = 0; this.qLen = 0; this.qOff = 0; return; }",
        "      this.qL.push(e.data.l); this.qR.push(e.data.r); this.qLen += e.data.l.length;",
        "      if(this.qLen > 44100 * 2){",
        "        while(this.qLen > 44100){",
        "          var l = this.qL.shift(); this.qR.shift();",
        "          this.qLen -= l.length - this.qOff; this.qOff = 0;",
        "        }",
        "      }",
        "    };",
        "  }",
        "  process(inputs, outputs){",
        "    var out = outputs[0];",
        "    var chL = out[0], chR = out.length>1?out[1]:out[0];",
        "    for(var i=0;i<chL.length;i++){",
        "      if(this.qLen <= 0){ chL[i]=0; chR[i]=0; continue; }",
        "      var l = this.qL[0], r = this.qR[0];",
        "      chL[i] = l[this.qOff]; chR[i] = r[this.qOff];",
        "      this.qOff++; this.qLen--;",
        "      if(this.qOff >= l.length){ this.qL.shift(); this.qR.shift(); this.qOff = 0; }",
        "    }",
        "    return true;",
        "  }",
        "}",
        "registerProcessor('gb-processor', GBProcessor);"
      ].join("\n");
      function tryWorklet(){
        if(!ctx.audioWorklet)return Promise.reject(new Error('no audioWorklet'));
        const url=URL.createObjectURL(new Blob([WORKLET_SRC],{type:'application/javascript'}));
        return ctx.audioWorklet.addModule(url).then(()=>{
          node=new AudioWorkletNode(ctx,'gb-processor',{outputChannelCount:[2]});
          node.port.onmessage=e=>{if(typeof e.data.qLen==='number')workletBacklog=e.data.qLen}; // stat replies only; worklet posts nothing else
          node.connect(master);
          mode='worklet';
        });
      }
      function initScriptProcessor(){
        node=ctx.createScriptProcessor(2048,0,2);
        node.onaudioprocess=event=>{
          const outL=event.outputBuffer.getChannelData(0),outR=event.outputBuffer.getChannelData(1);
          let i=0;
          while(i<outL.length){
            if(spQueue.length===0){for(;i<outL.length;i++){outL[i]=0;outR[i]=0}break}
            const chunk=spQueue[0];
            const take=Math.min(chunk.L.length-chunk.offset,outL.length-i);
            for(let k=0;k<take;k++){outL[i+k]=chunk.L[chunk.offset+k];outR[i+k]=chunk.R[chunk.offset+k]}
            chunk.offset+=take; i+=take;
            if(chunk.offset>=chunk.L.length)spQueue.shift();
          }
        };
        node.connect(master);
        mode='scriptprocessor';
        return Promise.resolve();
      }
      let wasInterrupted=false;
      function init(){
        const Ctx=window.AudioContext||window.webkitAudioContext;
        if(!Ctx)return Promise.reject(new Error('no AudioContext'));
        ctx=new Ctx();
        ctx.addEventListener('statechange',()=>{
          // after an interruption (WebKit 'interrupted', suspend, etc.) drop the
          // stale backlog so playback rejoins in sync instead of replaying it
          if(ctx.state!=='running'){wasInterrupted=true;return}
          if(wasInterrupted){wasInterrupted=false;clear()}
        });
        master=ctx.createGain();
        master.gain.value=muted?0:volume;
        master.connect(ctx.destination);
        return tryWorklet().catch(()=>initScriptProcessor());
      }
      function push(inL,inR,n){
        if(!ctx||!mode)return;
        const res=resample(inL,inR,n,ctx.sampleRate);
        if(res.n<=0)return;
        if(mode==='worklet'){
          node.port.postMessage({l:res.L,r:res.R});
        }else{
          spQueue.push({L:res.L,R:res.R,offset:0});
          // cap backlog to ~1s to avoid runaway latency
          let total=0;
          for(let i=0;i<spQueue.length;i++)total+=spQueue[i].L.length-spQueue[i].offset;
          while(total>ctx.sampleRate*1&&spQueue.length>1){
            total-=spQueue[0].L.length-spQueue[0].offset;
            spQueue.shift();
          }
        }
      }
      function clear(){
        resampler.pos=0;resampler.lastL=0;resampler.lastR=0;
        if(mode==='worklet'&&node)node.port.postMessage({clear:true});
        else spQueue.length=0;
      }
      // resume for any non-running, non-closed state (WebKit has a nonstandard 'interrupted')
      function resume(){ return ctx&&ctx.state!=='running'&&ctx.state!=='closed'?ctx.resume():Promise.resolve(); }
      function suspend(){ return ctx&&ctx.state==='running'?ctx.suspend():Promise.resolve(); }
      function stats(){ // sampler-only: worklet backlog is the previous stat reply (one-sample lag)
        let backlogFrames=0;
        if(mode==='worklet'){node.port.postMessage({stat:true});backlogFrames=workletBacklog}
        else if(mode==='scriptprocessor'){for(let i=0;i<spQueue.length;i++)backlogFrames+=spQueue[i].L.length-spQueue[i].offset}
        return{state:ctx?ctx.state:'none',mode:mode||'none',backlogFrames,sampleRate:ctx?ctx.sampleRate:0};
      }
      return {init,push,resume,suspend,setVolume,clear,stats};
    })();
    function pumpAudio(){
      if(!audioPtr)return;
      const n=api.readAudio(gb,audioPtr,AUDIO_MAX_FRAMES);
      if(n<=0)return;
      if(speed!==1)return; // off-speed: drain the core's buffer but stay silent
      const interleaved=Module.HEAPF32.subarray(audioPtr/4,audioPtr/4+n*2);
      const L=new Float32Array(n),R=new Float32Array(n);
      for(let i=0;i<n;i++){L[i]=interleaved[i*2];R[i]=interleaved[i*2+1]}
      AudioSystem.push(L,R,n);
    }
    function pauseEmulation(){
      if(!running)return;
      running=false;
      cancelAnimationFrame(rafId);
    }
    function resumeEmulation(){
      if(running||!started||userPaused||modsBusy)return;
      running=true;
      lastT=0; acc=0;
      rafId=requestAnimationFrame(loop);
    }
    const seenMessages=new WeakSet();
    function onMessage(event){
      if(seenMessages.has(event))return; // RN fires document or window depending on platform; never both for one message
      seenMessages.add(event);
      receive(event.data);
    }
    document.addEventListener('message',onMessage);
    window.addEventListener('message',onMessage);
    window.addEventListener('pagehide',()=>{persistSave();AudioSystem.suspend().catch(()=>{})});
    window.addEventListener('pageshow',event=>{
      if(event.persisted){location.reload();return} // back/forward cache restore: WASM/audio state is stale, start over
      AudioSystem.resume().catch(()=>{});
      if(running)lastT=0; // don't let the hidden gap schedule a catch-up burst
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'){
        persistSave();AudioSystem.suspend().catch(()=>{});
      }else{
        AudioSystem.resume().catch(()=>{});
        if(running)lastT=0;
      }
    });

    function draw(){
      const src=Module.HEAPU8.subarray(api.framebuffer(gb),api.framebuffer(gb)+W*H);
      for(let i=0,j=0;i<src.length;i++,j+=4){
        const p=(src[i]&3)*4;
        image.data[j]=palette[p]; image.data[j+1]=palette[p+1];
        image.data[j+2]=palette[p+2]; image.data[j+3]=255;
      }
      ctx.putImageData(image,0,0);
    }
    function loop(t){
      rafId=requestAnimationFrame(loop);
      rafCount++; // free; read/reset only by the 1 Hz telemetry sampler
      if(!lastT)lastT=t;
      let dt=t-lastT;
      lastT=t;
      if(dt>250)dt=250; // page was backgrounded; avoid a huge catch-up burst
      let frames=0;
      if(speed===Infinity){
        // uncapped: run as many frames as fit in ~11ms, leaving time to render
        const budget=performance.now()+11;
        while(performance.now()<budget&&!hostError){
          api.runFrame(gb); pumpAudio(); frames++;
        }
        acc=0;
      }else{
        acc+=dt*speed;
        const cap=Math.max(MAX_CATCHUP_FRAMES,Math.ceil(speed)+2);
        while(acc>=FRAME_MS && frames<cap && !hostError){
          api.runFrame(gb); pumpAudio(); acc-=FRAME_MS; frames++;
        }
        if(acc>FRAME_MS*cap)acc=FRAME_MS*cap;
      }
      if(hostError){
        started=false; pauseEmulation();
        status.style.display='flex'; status.textContent=hostError.message;
        reportError(hostError,'mod-host-callback');
      }
      frameCount+=frames; // free; read/reset only by the 1 Hz telemetry sampler
      if(frames) draw();
    }
    function sampleTelemetry(){
      const snap={
        t:Date.now(),
        rafFps:rafCount,
        emuFps:frameCount,
        speed:speed===Infinity?'inf':speed,
        accMs:Math.round(acc),
        running,
        audio:AudioSystem.stats(),
        wasmHeapBytes:Module?Module.HEAPU8.length:0,
        jsHeapBytes:performance.memory?performance.memory.usedJSHeapSize:null
      };
      rafCount=0;frameCount=0;
      notify('telemetry',snap);
    }
    function copyToHeap(bytes,operation){
      const ptr=Module._malloc(Math.max(1,bytes.length));
      try{ Module.HEAPU8.set(bytes,ptr); return operation(ptr); }
      finally{ Module._free(ptr); }
    }
    function decodeCString(pointer){
      if(!pointer)return '';
      const heap=Module.HEAPU8;
      if(pointer<0||pointer>=heap.length)throw new RangeError('Invalid C string pointer');
      const bytes=[];
      for(let cursor=pointer;cursor<heap.length;cursor++){
        const byte=heap[cursor];
        if(byte===0)break;
        bytes.push(byte);
      }
      let result='';
      for(let i=0;i<bytes.length;){
        const first=bytes[i++];
        if(first<0x80){result+=String.fromCharCode(first);continue}
        let codePoint,continuations;
        if((first&0xe0)===0xc0){codePoint=first&0x1f;continuations=1}
        else if((first&0xf0)===0xe0){codePoint=first&0x0f;continuations=2}
        else if((first&0xf8)===0xf0){codePoint=first&7;continuations=3}
        else{result+='\ufffd';continue}
        if(i+continuations>bytes.length){result+='\ufffd';break}
        let valid=true;
        for(let j=0;j<continuations;j++){
          const next=bytes[i+j];
          if((next&0xc0)!==0x80){valid=false;break}
          codePoint=(codePoint<<6)|(next&0x3f);
        }
        if(!valid){result+='\ufffd';continue}
        i+=continuations;
        result+=codePoint<=0xffff?String.fromCharCode(codePoint):String.fromCodePoint(codePoint);
      }
      return result;
    }
    function modError(status,operation='mod operation'){
      if(status===0)return;
      let message='',decodeError=null;
      try{message=decodeCString(api.modLastError(gb))}
      catch(error){decodeError=error instanceof Error?error.message:String(error)}
      const failure=new Error(message||(operation+' failed ('+status+')'));
      failure.operation=operation;
      failure.status=status;
      failure.decodeError=decodeError;
      throw failure;
    }
    function cpuContext(pointer){
      const view=()=>new DataView(Module.HEAPU8.buffer);
      const cpu={};
      for(const [name,offset] of Object.entries({af:4,bc:6,de:8,hl:10,sp:12,pc:14})){
        Object.defineProperty(cpu,name,{get:()=>view().getUint16(pointer+offset,true),set:value=>view().setUint16(pointer+offset,name==='af'?value&0xfff0:value&0xffff,true)});
      }
      Object.defineProperty(cpu,'a',{get:()=>cpu.af>>>8,set:value=>{cpu.af=((value&255)<<8)|(cpu.af&240)}});
      Object.defineProperty(cpu,'ime',{get:()=>view().getUint8(pointer+16)!==0,set:value=>view().setUint8(pointer+16,value?1:0)});
      Object.defineProperty(cpu,'halted',{get:()=>view().getUint8(pointer+17)!==0,set:value=>view().setUint8(pointer+17,value?1:0)});
      return cpu;
    }
    function persistSave(){
      if(!gb||!saveReady||!api.hasBattery(gb))return;
      const lenPtr=Module._malloc(4);
      try{
        Module.HEAPU32[lenPtr/4]=0;
        const ptr=api.saveRam(gb,lenPtr),len=Module.HEAPU32[lenPtr/4];
        if(!ptr||!len)return;
        let binary='',bytes=Module.HEAPU8.subarray(ptr,ptr+len);
        for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
        const data=btoa(binary),ts=Date.now();
        hasPersisted=true;
        try{localStorage.setItem('pokeboy.save.'+cartridgeId,JSON.stringify({v:1,ts,data}))}catch(error){}
        // mirror to native even if localStorage failed; blocked while the boot
        // handshake is unresolved so a blank session can't clobber a good backup
        if(!mirrorBlocked)notify('save',{id:cartridgeId,ts,data});
      }finally{Module._free(lenPtr)}
    }
    function decodeSave(data){
      if(typeof data!=='string')throw new Error('Invalid save data');
      const binary=atob(data);
      return Uint8Array.from(binary,char=>char.charCodeAt(0));
    }
    function b64encode(bytes){
      let binary='';
      for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
      return btoa(binary);
    }
    function b64decode(data){
      const binary=atob(data),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    }
    async function gzipBytes(bytes,mode){
      const Stream=mode==='gzip'?CompressionStream:DecompressionStream;
      const stream=new Blob([bytes]).stream().pipeThrough(new Stream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    async function encodeState(heap,nonce){
      try{
        let gz=false,bytes=heap;
        if(typeof CompressionStream==='function'){bytes=await gzipBytes(heap,'gzip');gz=true}
        notify('state-data',{
          nonce,gz,heapLen:heap.length,base64:b64encode(bytes),
          cartridgeId,cartridgeVersion,mods:Array.from(loadedMods.keys())
        });
      }catch(error){notify('state-error',{nonce,message:(error&&error.message)||String(error)})}
    }
    // Restoring a snapshot only makes sense in a session whose boot walked the
    // same allocations (same core build, cartridge, and mod set): then the JS
    // gb/audioPtr pointers and the host-callback table slot all line up. The
    // shell enforces the core hash; cartridge and mods are checked here.
    async function applyState(msg){
      try{
        if(msg.cartridgeId!==cartridgeId)throw new Error('STATE IS FOR ANOTHER CARTRIDGE');
        const mods=Array.isArray(msg.mods)?msg.mods:[];
        const current=Array.from(loadedMods.keys());
        if(mods.length!==current.length||mods.some(id=>!current.includes(id)))throw new Error('STATE MOD SET MISMATCH');
        pauseEmulation();
        let bytes=b64decode(msg.base64);
        if(msg.gz)bytes=await gzipBytes(bytes,'gunzip');
        if(bytes.length<65536||bytes.length>256*1024*1024)throw new Error('INVALID STATE SIZE');
        if(bytes.length>Module.HEAPU8.length){
          // ALLOW_MEMORY_GROWTH: a large malloc grows the heap; the restore
          // overwrites the allocator's state anyway, so freeing is cosmetic.
          const grow=Module._malloc(bytes.length-Module.HEAPU8.length+65536);
          if(grow)Module._free(grow);
        }
        if(bytes.length>Module.HEAPU8.length)throw new Error('WASM MEMORY GROWTH FAILED');
        Module.HEAPU8.set(bytes,0);
        AudioSystem.clear();
        acc=0;lastT=0;
        api.setInput(gb,input.buttons|0,input.dpad|0);
        notify('state-loaded',{nonce:msg.nonce});
      }catch(error){
        notify('state-error',{nonce:msg.nonce,message:(error&&error.message)||String(error)});
      }finally{resumeEmulation()}
    }
    function localSave(){
      const key='pokeboy.save.'+cartridgeId;
      let raw=null;
      try{raw=localStorage.getItem(key)}catch(error){return null}
      if(!raw)return null;
      try{
        let save;
        if(raw.trimStart().startsWith('{')){
          const envelope=JSON.parse(raw);
          if(!envelope||envelope.v!==1||!Number.isFinite(envelope.ts)||envelope.ts<0||typeof envelope.data!=='string')throw new Error('Invalid save envelope');
          save={ts:envelope.ts,data:envelope.data};
        }else save={ts:0,data:raw};
        return {...save,bytes:decodeSave(save.data)};
      }catch(error){
        try{localStorage.setItem('pokeboy.save.corrupt.'+cartridgeId,raw)}catch(quarantineError){}
        try{localStorage.removeItem(key)}catch(removeError){}
        notify('save-corrupt',cartridgeId);
        return null;
      }
    }
    function lateSaveData(msg){
      mirrorBlocked=false; // host is alive after all; mirroring is safe again
      if(hasPersisted||typeof msg.data!=='string')return; // never overwrite this session's own progress
      const ts=Number.isFinite(msg.ts)&&msg.ts>=0?msg.ts:0;
      const local=localSave();
      if(!local||ts>local.ts){
        // don't load mid-game; stage it locally so the next boot picks it up
        try{localStorage.setItem('pokeboy.save.'+cartridgeId,JSON.stringify({v:1,ts,data:msg.data}))}catch(error){}
      }
    }
    async function restoreSave(){
      const local=localSave();
      let winner=local,hostWins=false;
      if(window.ReactNativeWebView){
        let timer;
        saveNonce=Math.random().toString(36).slice(2)+Date.now().toString(36);
        const host=await Promise.race([
          new Promise(resolve=>{saveDataWaiter=resolve;notify('save-request',{id:cartridgeId,nonce:saveNonce})}),
          new Promise(resolve=>{timer=setTimeout(()=>resolve(null),3000)})
        ]);
        clearTimeout(timer);saveDataWaiter=null;
        if(!host&&!local)mirrorBlocked=true; // host never answered + nothing local: don't let a blank session overwrite the backup
        if(host&&host.data!==null){
          try{
            const candidate={
              ts:Number.isFinite(host.ts)&&host.ts>=0?host.ts:0,
              data:host.data,
              bytes:decodeSave(host.data)
            };
            if(!winner||candidate.ts>winner.ts){winner=candidate;hostWins=true}
          }catch(error){notify('save-corrupt',cartridgeId)}
        }
      }
      if(!winner)return;
      if(hostWins){
        try{localStorage.setItem('pokeboy.save.'+cartridgeId,JSON.stringify({v:1,ts:winner.ts,data:winner.data}))}catch(error){}
      }
      copyToHeap(winner.bytes,ptr=>api.loadSaveRam(gb,ptr,winner.bytes.length));
    }
    function installHostBridge(){
      hostCallback=Module.addFunction((_gb,handle,index,context)=>{
        const handler=modHandlers.get(handle)?.[index];
        if(!handler){hostError=new Error('Missing mod host handler');return}
        try{
          handler(cpuContext(context),{
            read8:address=>api.read8(gb,address&0xffff),
            write8:(address,value)=>api.write8(gb,address&0xffff,value&255)
          });
        }catch(error){hostError=error instanceof Error?error:new Error(String(error))}
      },'viiiii');
      api.modSetHost(gb,hostCallback,0);
    }
    function resolveHostImports(handle){
      const handlers=[];
      const core=window.PokeboyModCore||{};
      for(let index=0;index<api.modImportCount(gb,handle);index++){
        const name=api.modImportName(gb,handle,index);
        if(typeof core[name]!=='function')throw new Error("MOD HOST IMPORT '"+name+"' IS NOT INSTALLED");
        handlers.push(core[name]);
      }
      modHandlers.set(handle,handlers);
    }
    async function reconcileMods(){
      if(!gb)return;
      modsBusy++; pauseEmulation();
      try{
        for(const [id,handle] of loadedMods){
          if(!desiredMods.includes(id)){ modError(api.modUnload(gb,handle)); loadedMods.delete(id); modHandlers.delete(handle); }
        }
        for(const id of desiredMods){
          if(loadedMods.has(id))continue;
          const version=modVersions.get(id)||'0';
          const bytes=await localFirstPayload(
            'mod:'+id+'@'+version,
            '/api/mods/'+encodeURIComponent(id),
            "MOD '"+id+"' NOT INSTALLED"
          );
          const out=Module._malloc(4);
          try{
            Module.HEAPU32[out/4]=0;
            copyToHeap(bytes,ptr=>modError(api.modLoad(gb,ptr,bytes.length,out)));
            const handle=Module.HEAPU32[out/4];
            try{resolveHostImports(handle)}catch(error){api.modUnload(gb,handle);throw error}
            loadedMods.set(id,handle);
          }finally{Module._free(out)}
        }
        notify('mods',Array.from(loadedMods.keys()));
      }finally{modsBusy--;resumeEmulation()}
    }
    async function boot(){
      bootStage='wasm-initialize';
      // file:// pages can't fetch() sibling files in WKWebView, so the host
      // hands us the wasm bytes; locateFile stays as the hosted fallback.
      let wasmBinary;
      if(runtime.wasmBase64){
        const raw=atob(runtime.wasmBase64);
        wasmBinary=new Uint8Array(raw.length);
        for(let i=0;i<raw.length;i++)wasmBinary[i]=raw.charCodeAt(i);
      }
      Module=await createGBCore({wasmBinary,locateFile:file=>file.endsWith('.wasm')?runtime.wasmUri:file});
      bootStage='api-bindings';
      api={
        create:Module.cwrap('gb_create','number',[]),
        loadRom:Module.cwrap('gb_load_rom','number',['number','number','number']),
        runFrame:Module.cwrap('gb_run_frame',null,['number']),
        framebuffer:Module.cwrap('gb_framebuffer','number',['number']),
        setInput:Module.cwrap('gb_set_input',null,['number','number','number']),
        readAudio:Module.cwrap('gb_read_audio','number',['number','number','number']),
        modSymbols:Module.cwrap('gb_mod_load_symbols','number',['number','number','number']),
        modLoad:Module.cwrap('gb_mod_load','number',['number','number','number','number']),
        modUnload:Module.cwrap('gb_mod_unload','number',['number','number']),
        modLastError:Module.cwrap('gb_mod_last_error','number',['number']),
        modImportCount:Module.cwrap('gb_mod_import_count','number',['number','number']),
        modImportName:Module.cwrap('gb_mod_import_name','string',['number','number','number']),
        modSetHost:Module.cwrap('gb_mod_set_host_callback',null,['number','number','number']),
        read8:Module.cwrap('gb_read_mem','number',['number','number']),
        write8:Module.cwrap('gb_write_mem',null,['number','number','number']),
        hasBattery:Module.cwrap('gb_has_battery','number',['number']),
        saveRam:Module.cwrap('gb_save_ram','number',['number','number']),
        loadSaveRam:Module.cwrap('gb_load_save_ram','number',['number','number','number'])
      };
      bootStage='core-create';
      gb=api.create();
      audioPtr=Module._malloc(AUDIO_MAX_FRAMES*2*4);
      AudioSystem.init().then(()=>AudioSystem.resume()).catch(()=>{}); // no audio: run silently (push() no-ops)
      bootStage='host-bridge';
      installHostBridge();
      bootStage='request-configuration';
      cartridgeId=runtime.cartridgeId||'';
      cartridgeVersion=runtime.cartridgeVersion||'0';
      const apiKey=runtime.apiKey||'';
      requestOptions=apiKey?{headers:{'x-api-key':apiKey}}:{};
      if(!cartridgeId) throw new Error('No cartridge selected');
      bootStage='registry-load';
      const registry=await localFirstJson('registry','/api/registry');
      void evictStaleCache(registry);
      modVersions=new Map((registry.mods||[]).map(mod=>[mod.id,mod.version]));
      bootStage='rom-load';
      const bytes=await cachedRom(cartridgeId,cartridgeVersion);
      const ptr=Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes,ptr);
      const ok=api.loadRom(gb,ptr,bytes.length);
      Module._free(ptr);
      if(!ok) throw new Error('INVALID ROM');
      bootStage='save-restore';
      await restoreSave();
      saveReady=true;
      bootStage='symbols-load';
      try{
        const bytes=await localFirstPayload(
          'symbols:'+cartridgeId+'@'+cartridgeVersion,
          '/api/mods/symbols/'+encodeURIComponent(cartridgeId),
          'SYMBOLS NOT INSTALLED'
        );
        copyToHeap(bytes,ptr=>modError(api.modSymbols(gb,ptr,bytes.length),'gb_mod_load_symbols'));
      }catch(error){if(error.message!=='SYMBOLS NOT INSTALLED')throw error}
      api.setInput(gb,input.buttons,input.dpad);
      bootStage='mods-reconcile';
      await reconcileMods();
      status.style.display='none';
      notify('ready',cartridgeId);
      started=true;
      setInterval(persistSave,10000); // wall-clock save cadence: every 10s
      bootStage='running';
      resumeEmulation();
    }
    boot().catch(error=>{const detail=reportError(error);status.textContent=detail.message});
  })().catch(error=>{
    // Bootstrap failures (missing PokeboyRuntime, core script load) happen
    // before reportError/status exist in scope — report them by hand so they
    // can never fail silently.
    const message=error instanceof Error?error.message:String(error);
    const statusEl=document.getElementById('status');
    if(statusEl)statusEl.textContent=message;
    window.ReactNativeWebView?.postMessage(JSON.stringify({
      type:'error',
      detail:{message,name:(error&&error.name)||'Error',stack:(error&&error.stack)||null,stage:'bootstrap'}
    }));
  });
  </script>
</body>
