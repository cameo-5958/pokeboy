    --lcd-1:#8fa878;
    --lcd-2:#4e6350;
    --lcd-3:#1c2b22;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#08090a; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    /* anchored to edges (no dvh: avoids the iOS dynamic-viewport gap bug);
       top gap leaves the cartridge slot zone visible above the console */
    position:fixed; left:0; right:0; bottom:0;
    top:calc(env(safe-area-inset-top) + 48px);
    border-radius:26px 26px 0 0;
    background:linear-gradient(170deg, var(--shell-1) 0%, var(--shell-2) 62%, var(--shell-3) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.3), 0 -4px 14px rgba(0,0,0,.5);
    display:grid;
    transition:transform .5s cubic-bezier(.5,.9,.3,1);
    padding-top:10px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    padding-left:max(10px, env(safe-area-inset-left));
    padding-right:max(10px, env(safe-area-inset-right));
    gap:8px;
  }

  /* ---------- brand strip ---------- */
  #brand{
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--ink-dim);
    font-family:var(--font-pixel);
    font-size:6px; letter-spacing:.1em;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    grid-area:brand;
  }
  #brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--led-amber);
    box-shadow:0 0 6px 1px var(--led-amber); }
  #brand .dot.off{ background:#5a4a2c; box-shadow:none; }
  #brand .dot.playing{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ---------- screen ---------- */
  #screen-wrap{
    grid-area:screen;
    display:flex; align-items:center; justify-content:center;
    min-height:0; min-width:0;
    position:relative;
    width:100%; height:100%;
  }
  #bezel{
    position:relative;
    background:linear-gradient(165deg,#59556a,var(--bezel) 65%);
    border-radius:12px 12px 42px 12px; /* DMG's signature big bottom-right corner */
    padding:30px 16px 18px;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.08),
      inset 0 -3px 8px rgba(0,0,0,.5),
      0 6px 16px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    max-width:100%; max-height:100%;
    min-height:0;
  }
  /* the classic two-tone stripe + caption across the bezel top */
  #bezel::before{
    content:""; position:absolute; top:12px; left:16px; right:16px; height:5px;
    border-top:2px solid #8a3557;
    border-bottom:2px solid #2c4f92;
  }
  #bezel::after{
    content:"DOT MATRIX WITH STEREO SOUND";
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    padding:0 8px; background:#575368;
    font-family:var(--font-pixel);
    font-size:5.5px; letter-spacing:.08em; white-space:nowrap;
    color:#cdcada;
  }
  /* dot-matrix pixel grid over the LCD */
  #bezel .lcd-grid{
    position:absolute; left:16px; right:16px; top:30px; bottom:18px;
    pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(28,43,34,.09) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(28,43,34,.07) 0 1px, transparent 1px 3px);
  }
  /* speaker grille, bottom-right of the shell */
  @media (orientation:portrait){
    #app::after{
      content:""; position:absolute; right:16px; bottom:12px;
      width:104px; height:78px;
      background:repeating-linear-gradient(115deg,
        transparent 0 13px, rgba(0,0,0,.38) 13px 18px);
      border-radius:8px;
      pointer-events:none;
    }
  }
  /* console pulled down while no cartridge is inserted */
  body.nocart #app{ transform:translateY(48%); }
  #screen{
    background:var(--lcd-0);
    image-rendering:pixelated;
    image-rendering:-webkit-optimize-contrast;
    display:block;
    box-shadow:0 0 0 1px rgba(0,0,0,.4) inset;
    border-radius:2px;
  }

  /* ---------- controls ---------- */
  #controls{ grid-area:controls; display:grid; min-height:0; }

  .dpad{
    position:relative;
    width:132px; height:132px;
    touch-action:none;
  }
  .dpad-base{
    position:absolute; inset:0;
    background:radial-gradient(circle at 35% 30%, #4d5040, #23251d 70%);
    border-radius:16px;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.06), inset 0 -3px 6px rgba(0,0,0,.6);
  }
  .dpad-cross{
    position:absolute; inset:0;
  }
  .dpad-cross::before, .dpad-cross::after{
    content:""; position:absolute; background:linear-gradient(180deg,#141610,#0a0b08);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.5);
    border-radius:5px;
  }
  .dpad-cross::before{ left:38%; right:38%; top:6%; bottom:6%; }
  .dpad-cross::after{ top:38%; bottom:38%; left:6%; right:6%; }
  .dpad-dot{
    position:absolute; left:50%; top:50%; width:15px; height:15px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #1c1e17, #050604 70%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8), 0 1px 1px rgba(255,255,255,.05);
  }
  /* molded direction arrows on the cross tips */
  .dpad-arrow{
    position:absolute; width:0; height:0;
    border:6px solid transparent;
    opacity:.5;
  }
  .dpad-arrow.up{ left:50%; top:11%; transform:translateX(-50%);
    border-bottom-color:#2b2e24; border-top-width:0; }
  .dpad-arrow.down{ left:50%; bottom:11%; transform:translateX(-50%);
    border-top-color:#2b2e24; border-bottom-width:0; }
  .dpad-arrow.left{ top:50%; left:11%; transform:translateY(-50%);
    border-right-color:#2b2e24; border-left-width:0; }
  .dpad-arrow.right{ top:50%; right:11%; transform:translateY(-50%);
    border-left-color:#2b2e24; border-right-width:0; }
  .dpad-glow{
    position:absolute; border-radius:4px; background:var(--led-amber);
    opacity:0; filter:blur(1px); transition:opacity .05s linear;
    pointer-events:none;
  }
  .dpad-glow.up{ left:38%; right:38%; top:4%; height:44%; }
  .dpad-glow.down{ left:38%; right:38%; bottom:4%; height:44%; }
  .dpad-glow.left{ top:38%; bottom:38%; left:4%; width:44%; }
  .dpad-glow.right{ top:38%; bottom:38%; right:4%; width:44%; }
  .dpad-glow.on{ opacity:.55; }

  .action-btn{
    appearance:none; border:none; outline:none;
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%, #a84a75, #571c36 78%);
    color:rgba(255,224,236,.8);
    font-family:var(--font-pixel);
    font-size:13px;
    text-shadow:0 -1px 1px rgba(0,0,0,.55), 0 1px 1px rgba(255,255,255,.15);
    box-shadow:
      inset 0 3px 3px rgba(255,255,255,.22),
      inset 0 -5px 7px rgba(0,0,0,.6),
      0 3px 4px rgba(0,0,0,.5),
      0 0 0 3px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    font-family:inherit;
    transition:transform .04s ease, box-shadow .04s ease;
    position:relative;
  }
  .action-btn:active, .action-btn.held{
    transform:translateY(2px);
    box-shadow:
      inset 0 3px 4px rgba(0,0,0,.65),
      0 1px 2px rgba(0,0,0,.4),
      0 0 0 3px rgba(0,0,0,.25);
    background:radial-gradient(circle at 35% 28%, #8e3a60, #40142a 78%);
  }
  /* classic offset: A sits high-right, B low-left */
  .face-cluster{ display:flex; align-items:center; position:relative; }
  /* recessed angled tray behind A/B, like the molded shell well */
  .face-cluster::before{
    content:""; position:absolute; inset:-10px -12px;
    transform:rotate(-27deg);
    border-radius:999px;
    background:rgba(0,0,0,.2);
    box-shadow:inset 0 3px 7px rgba(0,0,0,.5), 0 1px 1px rgba(255,255,255,.06);
  }
  #btnA{ margin-bottom:34px; }
  #btnB{ margin-top:34px; }

  .pill-btn{
    appearance:none; border:none; outline:none;
    background:linear-gradient(180deg,#484a3e,#20211a);
    color:var(--ink-dim);
    border-radius:999px;
    font-size:9.5px; font-weight:700; letter-spacing:.12em;
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.12),
      inset 0 -3px 4px rgba(0,0,0,.6),
      0 0 0 3px rgba(0,0,0,.28),
      0 1px 1px rgba(255,255,255,.05);
    transform:rotate(-25deg);
    font-family:inherit;
  }
  .pill-btn:active, .pill-btn.held{
    box-shadow:inset 0 2px 4px rgba(0,0,0,.65), 0 0 0 3px rgba(0,0,0,.28);
    color:var(--ink);
  }
  .pill-label{ display:block; text-align:center; margin-top:6px; font-family:var(--font-pixel); font-size:6px; letter-spacing:.08em; color:var(--ink-dim); transform:rotate(-25deg); text-shadow:0 1px 0 rgba(255,255,255,.3); }

  /* ===== Portrait layout ===== */
  @media (orientation:portrait){
    #app{
      grid-template-rows:auto 1fr auto;
      grid-template-areas:"brand" "screen" "controls";
    }
    #controls{
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto auto auto auto;
      grid-template-areas:"vol vol" "spd spd" "dpad face" "system system";
      align-items:center;
      padding:6px 10px 2px;
      gap:6px;
    }
    #volume{ grid-area:vol; justify-self:center; width:min(320px, 82%); margin-bottom:2px; }
    #speed{ grid-area:spd; justify-self:center; width:min(320px, 82%); margin-bottom:4px; }
    .dpad{ grid-area:dpad; justify-self:center; }
    .face-cluster{
      grid-area:face; justify-self:center;
      gap:16px;
    }
    .face-cluster .action-btn{ width:60px; height:60px; }
    .system-cluster{
      grid-area:system; justify-self:center;
      display:flex; gap:22px; margin-top:2px;
    }
    .system-cluster .pill-btn{ width:52px; height:20px; }
  }

  /* ===== Landscape layout ===== */
  @media (orientation:landscape){
    #app{
      /* side columns get a real share of the width so their contents
         can center instead of hugging the screen edge */
      grid-template-columns:minmax(180px, 24%) 1fr minmax(180px, 24%);
      grid-template-rows:auto 1fr;
      grid-template-areas:"brand brand brand" "controls screen controls2";
      column-gap:10px;
    }
    #brand{ grid-area:brand; }
    #controls{ display:contents; }
    #volume{ grid-area:controls2; align-self:start; justify-self:center; width:82%; max-width:250px; margin-top:12px; }
    #speed{ grid-area:controls2; align-self:start; justify-self:center; width:82%; max-width:250px; margin-top:52px; }
    .dpad{ grid-area:controls; align-self:center; justify-self:center; }
    .face-cluster{
      grid-area:controls2; align-self:center; justify-self:center;
      gap:16px;
    }
    .face-cluster .action-btn{ width:62px; height:62px; }
    .system-cluster{
      grid-area:controls2; align-self:end; justify-self:center; margin-bottom:10px;
      display:flex; gap:20px;
    }
    .system-cluster .pill-btn{ width:48px; height:17px; }
    .system-cluster .pill-label{ display:none; }
  }

  /* ---------- volume ---------- */
  #volume, #speed{
    display:flex; align-items:center; gap:10px;
  }
  #speedVal{ min-width:26px; text-align:right; }
  .vol-label{
    font-family:var(--font-pixel); font-size:6px; letter-spacing:.08em;
    color:var(--ink-dim); text-shadow:0 1px 0 rgba(255,255,255,.3);
  }
  #volSlider, #speedSlider{
    -webkit-appearance:none; appearance:none;
    flex:1; height:8px; border-radius:4px;
    background:linear-gradient(180deg,#8f8b7e,#a8a498);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.45), 0 1px 1px rgba(255,255,255,.35);
    outline:none;
    touch-action:pan-x;
  }
  #volSlider::-webkit-slider-thumb, #speedSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:24px; height:24px; border-radius:50%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 2px, transparent 2px 5px),
      radial-gradient(circle at 35% 30%, #55584a, #23251d 78%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.6),
               0 2px 4px rgba(0,0,0,.45);
  }
  #volSlider::-moz-range-thumb, #speedSlider::-moz-range-thumb{
    width:24px; height:24px; border-radius:50%; border:none;
    background:radial-gradient(circle at 35% 30%, #55584a, #23251d 78%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.6),
               0 2px 4px rgba(0,0,0,.45);
  }

  /* ---------- custom music toggle ---------- */
  #musicBtn{
    appearance:none; border:none; outline:none;
    width:26px; height:26px; border-radius:50%;
    flex:none;
    font-size:12px; line-height:1;
    color:var(--led-amber);
    background:radial-gradient(circle at 35% 30%, #55584a, #23251d 78%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.6),
               0 2px 4px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    font-family:inherit;
  }
  #musicBtn[hidden]{ display:none; }
  #musicBtn.muted{ color:var(--ink-dim); }
  #musicBtn:active{
    box-shadow:inset 0 2px 4px rgba(0,0,0,.65);
  }

  /* ---------- cartridge dock ---------- */
  #cartDock{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    z-index:15; width:172px;
    padding-top:env(safe-area-inset-top);
    pointer-events:none;
  }
  /* slot opening: part of the console, rides its top edge */
  .cart-slot-lip{
    position:absolute; z-index:4;
    top:-5px; left:50%; margin-left:-82px; width:164px; height:9px;
    background:linear-gradient(180deg,#050604,#191b14);
    border-radius:4px;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.95), 0 1px 1px rgba(255,255,255,.25);
  }
  /* inserted cartridge: sticks up out of the console's slot, moves with it */
  #cartTab{
    appearance:none; border:none; outline:none; padding:0;
    position:absolute; z-index:3;
    top:-44px; left:50%; margin-left:-78px; width:156px;
    background:transparent; font-family:inherit; cursor:pointer;
    pointer-events:auto;
    transition:transform .3s cubic-bezier(.34,1.4,.5,1), opacity .22s ease;
  }
  #cartTab.out{
    transform:translateY(-110px); opacity:0; pointer-events:none;
  }
  /* cartridge body: opening faces up */
  .cart-body{
    display:block; margin:0 8px;
    background:linear-gradient(180deg,#6e7361,#494d3f);
    border-radius:10px 10px 0 0;
    padding:7px 10px 9px;
    box-shadow:inset 0 3px 3px rgba(255,255,255,.12), inset 2px 0 2px rgba(255,255,255,.06),
               inset -2px 0 2px rgba(0,0,0,.25), 0 3px 6px rgba(0,0,0,.5);
  }
  .cart-grip{
    display:block; height:6px; margin:0 20px 5px;
    background:repeating-linear-gradient(90deg,#31342a 0 4px,#4c5042 4px 8px);
    border-radius:2px;
  }
  .cart-sticker{
    display:block;
    background:linear-gradient(160deg,#2c4f92,#15294d);
    color:#dfe6f2;
    font-family:var(--font-pixel);
    font-size:6.5px; letter-spacing:.04em; text-transform:uppercase;
    text-align:center; padding:5px 6px; border-radius:2px;
    border:1px solid rgba(0,0,0,.45);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #cartTray{
    overflow:hidden; max-height:0; margin:4px 2px 0;
    transition:max-height .32s ease;
    pointer-events:auto;
  }
  #cartDock.open #cartTray{ max-height:62vh; overflow-y:auto; }
  .cart-item{
    appearance:none; border:none; outline:none; font-family:inherit; cursor:grab;
    display:block; width:100%; margin:8px 0; padding:8px 10px 10px;
    background:linear-gradient(180deg,#6a6f5e,#3a3e33);
    border-radius:8px 8px 12px 12px;
    box-shadow:0 4px 8px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.1);
    touch-action:none;
  }
  /* cartridge being dragged: fixed clone following the pointer */
  .cart-ghost{
    position:fixed; left:0; top:0; margin:0; z-index:30;
    pointer-events:none; will-change:transform;
    box-shadow:0 14px 26px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.1);
  }
  .cart-item.drag-src{ visibility:hidden; }
  /* slot opening lights up while a cart is in flight */
  body.cart-dragging .cart-slot-lip{
    box-shadow:inset 0 2px 3px rgba(0,0,0,.95), 0 0 12px 3px var(--led-amber);
  }
  .cart-item.current{ box-shadow:0 4px 8px rgba(0,0,0,.5), 0 0 0 2px var(--led-amber); }
  .cart-item .cart-grip{ margin:0 26px 6px; }
  .cart-item .cart-sticker{ font-size:7.5px; padding:10px 6px; }
  .cart-item .cart-sticker img{
    display:block; width:100%; height:70px;
    object-fit:cover; border-radius:2px;
    image-rendering:pixelated;
    margin-bottom:4px;
  }
  .cart-item .cart-name{ display:block; }
  .cart-item.err .cart-sticker{ background:linear-gradient(160deg,#8a2a2a,#4d1515); }

  @media (orientation:landscape){
    #cartDock{ left:max(14px, env(safe-area-inset-left)); transform:none; }
    #cartTab{ left:calc(max(14px, env(safe-area-inset-left)) + 8px); margin-left:0; }
    .cart-slot-lip{ left:calc(max(14px, env(safe-area-inset-left)) + 4px); margin-left:0; }
  }
  @media (orientation:portrait){
    #brand{ justify-content:flex-start; padding-left:8px; }
  }

  /* ---------- overlay ---------- */
  #overlay{
    position:fixed; inset:0; z-index:20;
    background:rgba(6,7,5,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    gap:14px;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-family:var(--font-pixel);
    font-size:13px; margin:0; letter-spacing:.02em; color:#eae6d8;
  }
  #overlay p{
    margin:0; color:var(--ink-dim); font-size:13.5px; max-width:320px; line-height:1.5;
  }
  #overlay button{
    margin-top:8px; padding:12px 30px; font-size:14px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    border:none; border-radius:999px; color:#1b1408;
    background:linear-gradient(180deg,#f3c15f,var(--led-amber));
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  #overlay.error h1{ color:#e37a5f; }
  #overlay .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.15); border-top-color:var(--led-amber);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="app">
  <button id="cartTab" class="out" aria-label="pull out cartridge">
    <span class="cart-body">
      <span class="cart-grip"></span>
      <span class="cart-sticker" id="cartTitle">CARTRIDGE</span>
    </span>
  </button>
  <div class="cart-slot-lip"></div>
  <div id="brand"><span class="dot" id="powerDot"></span>BATTERY</div>

  <div id="screen-wrap">
    <div id="bezel"><canvas id="screen" width="160" height="144"></canvas><div class="lcd-grid"></div></div>
  </div>

  <div id="controls">
    <div id="volume">
      <span class="vol-label">VOLUME</span>
      <input id="volSlider" type="range" min="0" max="100" value="70" aria-label="volume">
      <button id="musicBtn" hidden aria-label="toggle custom music">&#9835;</button>
    </div>
    <div id="speed">
      <span class="vol-label">SPEED</span>
      <input id="speedSlider" type="range" min="0" max="4" step="1" value="1" aria-label="speed">
      <span class="vol-label" id="speedVal">x1</span>
    </div>
    <div class="dpad" id="dpad">
      <div class="dpad-base"></div>
      <div class="dpad-cross"></div>
      <div class="dpad-glow up" id="glowUp"></div>
      <div class="dpad-glow down" id="glowDown"></div>
      <div class="dpad-glow left" id="glowLeft"></div>
      <div class="dpad-glow right" id="glowRight"></div>
      <div class="dpad-arrow up"></div>
      <div class="dpad-arrow down"></div>
      <div class="dpad-arrow left"></div>
      <div class="dpad-arrow right"></div>
      <div class="dpad-dot"></div>
    </div>
    <div class="face-cluster">
      <button class="action-btn" id="btnB">B</button>
      <button class="action-btn" id="btnA">A</button>
    </div>
    <div class="system-cluster">
      <div><button class="pill-btn" id="btnSelect"></button><span class="pill-label">SELECT</span></div>
      <div><button class="pill-btn" id="btnStart"></button><span class="pill-label">START</span></div>
    </div>
  </div>
</div>

<div id="cartDock">
  <div id="cartTray"></div>
</div>

<div id="overlay">
  <div class="spinner" id="ovSpinner"></div>
  <h1 id="ovTitle">Powering up&hellip;</h1>
  <p id="ovText">Starting the emulator core.</p>
  <button id="ovButton" style="display:none">Tap to start</button>
</div>

<script src="gbcore.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- constants ---------------- */

  var canvas = document.getElementById("screen");

  /* size the canvas to fill the screen area, preserving 10:9 */
  (function(){
    var wrap = document.getElementById("screen-wrap");
    var bezel = document.getElementById("bezel");
    function fit(){
      var cs = getComputedStyle(bezel);
      var padW = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      var padH = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      var availW = wrap.clientWidth - padW;
      var availH = wrap.clientHeight - padH;
      var scale = Math.max(1, Math.min(availW / W, availH / H));
      canvas.style.width = Math.floor(W * scale) + "px";
      canvas.style.height = Math.floor(H * scale) + "px";
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function(){ setTimeout(fit, 60); });
    if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
  })();

  var ctx2d = canvas.getContext("2d", { alpha:false });

  /* ---------------- input ---------------- */
  var buttonState = 0, dpadState = 0;
  function setButton(mask, on){
    buttonState = on ? (buttonState | mask) : (buttonState & ~mask);
    syncInput();
  }
  function setDpad(mask, on){
    dpadState = on ? (dpadState | mask) : (dpadState & ~mask);
    syncInput();
  }
  function syncInput(){
    if(gb && api.setInput) api.setInput(gb, buttonState, dpadState);
  }

  function wireHoldButton(el, mask, isDpad, clickKind){
    var active = false;
    function down(e){
      e.preventDefault();
      active = true;
      el.classList.add("held");
      AudioSystem.playClick(clickKind || "btn");
      if(isDpad) setDpad(mask, true); else setButton(mask, true);
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    function up(e){
      if(!active) return;
      active = false;
      el.classList.remove("held");
      AudioSystem.playClick("release");
      if(isDpad) setDpad(mask, false); else setButton(mask, false);
    }
    el.addEventListener("pointerdown", down, {passive:false});
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  /* d-pad: single touch surface, tracks slide, supports diagonals */
  (function(){
    var pad = document.getElementById("dpad");
    var glowUp = document.getElementById("glowUp");
    var glowDown = document.getElementById("glowDown");
    var glowLeft = document.getElementById("glowLeft");
    var glowRight = document.getElementById("glowRight");
    var activePointer = null;
    var current = { up:false, down:false, left:false, right:false };

    function apply(next){
      if((next.up && !current.up) || (next.down && !current.down) ||
         (next.left && !current.left) || (next.right && !current.right)){
        AudioSystem.playClick("dpad");
      }
      if(next.up !== current.up){ setDpad(DPAD.UP, next.up); glowUp.classList.toggle("on", next.up); }
      if(next.down !== current.down){ setDpad(DPAD.DOWN, next.down); glowDown.classList.toggle("on", next.down); }
      if(next.left !== current.left){ setDpad(DPAD.LEFT, next.left); glowLeft.classList.toggle("on", next.left); }
      if(next.right !== current.right){ setDpad(DPAD.RIGHT, next.right); glowRight.classList.toggle("on", next.right); }
      current = next;
    }

    function clearAll(){ apply({up:false,down:false,left:false,right:false}); }

    function update(clientX, clientY){
      var rect = pad.getBoundingClientRect();
      var cx = rect.left + rect.width/2;
      var cy = rect.top + rect.height/2;
      var dx = clientX - cx;
      var dy = clientY - cy;
      var dead = rect.width * 0.16;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < dead){ clearAll(); return; }
      var angle = Math.atan2(dy, dx); // radians, 0 = right, PI/2 = down
      var deg = angle * 180 / Math.PI;
      // 8-way split with generous diagonal wedges
      var next = {up:false,down:false,left:false,right:false};
      if(deg > -112.5 && deg < -67.5){ next.up = true; }
      else if(deg >= -67.5 && deg <= -22.5){ next.up = true; next.right = true; }
      else if(deg > -22.5 && deg < 22.5){ next.right = true; }
      else if(deg >= 22.5 && deg <= 67.5){ next.down = true; next.right = true; }
      else if(deg > 67.5 && deg < 112.5){ next.down = true; }
      else if(deg >= 112.5 && deg <= 157.5){ next.down = true; next.left = true; }
      else if(deg > 157.5 || deg < -157.5){ next.left = true; }
      else { next.up = true; next.left = true; }
      apply(next);
    }

    pad.addEventListener("pointerdown", function(e){
      e.preventDefault();
      activePointer = e.pointerId;
      try{ pad.setPointerCapture(e.pointerId); }catch(err){}
      update(e.clientX, e.clientY);
    }, {passive:false});
    pad.addEventListener("pointermove", function(e){
      if(e.pointerId !== activePointer) return;
      e.preventDefault();
      update(e.clientX, e.clientY);
    }, {passive:false});
    function release(e){
      if(e.pointerId !== activePointer) return;
      activePointer = null;
      if(current.up || current.down || current.left || current.right){
        AudioSystem.playClick("release");
      }
      clearAll();
    }
    pad.addEventListener("pointerup", release);
    pad.addEventListener("pointercancel", release);
  })();

    "Enter":["btn",BTN.START], "Shift":["btn",BTN.SELECT]

    if(m[0]==="dpad") setDpad(m[1], true); else setButton(m[1], true);
  });
  window.addEventListener("keyup", function(e){
    var m = KEYMAP[e.key]; if(!m) return;
    if(m[0]==="dpad") setDpad(m[1], false); else setButton(m[1], false);
  });

  var lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

      node.connect(master);

      return Promise.resolve();
    }

    function push(inL, inR, n){
      if(!ctx) return;
      var res = resample(inL, inR, n, ctx.sampleRate);
      if(res.n <= 0) return;
      if(mode === "worklet"){
        node.port.postMessage({ l:res.L, r:res.R });
      } else if(mode === "scriptprocessor"){
        spQueue.push({ L:res.L, R:res.R, offset:0 });
        // cap backlog to ~1s to avoid runaway latency
        var total = 0;
        for(var i=0;i<spQueue.length;i++) total += (spQueue[i].L.length - spQueue[i].offset);
        while(total > ctx.sampleRate * 1 && spQueue.length > 1){
          total -= (spQueue[0].L.length - spQueue[0].offset);
          spQueue.shift();
        }
      }
    }

    function resume(){ if(ctx && ctx.state === "suspended") return ctx.resume(); return Promise.resolve(); }

    /* dedicated bus for the custom-music player: follows the master volume
       slider but carries its own gain so it can be muted independently */
    function musicChannel(){
      if(!ctx) return null;
      var g = ctx.createGain();
      g.connect(master);
      return { ctx:ctx, gain:g };
    }

    return { init:init, push:push, resume:resume, playClick:playClick, setVolume:setVolume, musicChannel:musicChannel };
  })();

  /* volume slider */
  (function(){
    var slider = document.getElementById("volSlider");
    try{
      var saved = localStorage.getItem("gbemu.volume");
      if(saved !== null) slider.value = saved;
    }catch(err){}
    slider.addEventListener("input", function(){
      AudioSystem.setVolume(slider.value / 100);
      try{ localStorage.setItem("gbemu.volume", slider.value); }catch(err){}
    });
  })();

  /* ---------------- custom music ----------------
     Per-rom soundtrack replacement. For supported roms (matched by cart id)
     the core will expose the game's location/music byte; each pack maps that
     byte to an audio file which plays in place of the game's own music.
     Gets its own mute button, independent of the master volume slider. */
  var CustomMusic = (function(){
    // rom-id -> pack. addr is the WRAM location of the game's current-map
    // byte (wCurMap); resolve() tiers that byte into one of the pack's
    // tracks. Red/Blue and Yellow share map ids, so they share a track set.
    var RB_DIR = "music/pokemon-rb/hgss/";
    // HGSS Kanto pack: per-area tracks keyed by pokered map ids. Where gen 1
    // shared one theme across areas (Viridian/Pewter/Saffron, Cerulean/
    // Fuchsia) the shared HGSS track covers all of them. Safari Zone plays
    // National Park (gen 1 has no park; closest match in spirit).
    var RB_AREAS = {
      "pallet-town":     [0],
      "pewter-city":     [1, 2, 10],                // Viridian/Pewter/Saffron
      "cerulean-city":   [3, 7],                    // Cerulean/Fuchsia
      "lavender-town":   [4, 142,143,144,145,146,147,148], // + Pokemon Tower
      "vermilion-city":  [5],
      "celadon-city":    [6],
      "cinnabar-island": [8, 30,31,32, 165,214,215,216], // + Routes 19-21, Mansion
      "pokemon-league":  [9, 174],                  // Indigo Plateau + lobby
      "route-1":         [12, 13],                  // Routes 1-2
      "route-3":         [14,15,16,17,18,19,20,21, 27,28,29, 33], // 3-10, 16-18, 22
      "route-11":        [22,23,24,25,26],          // Routes 11-15
      "route-24":        [35, 36],                  // Routes 24-25
      "route-26":        [34],                      // Route 23 (league approach)
      "viridian-forest": [51],
      "mt-moon":         [59, 60, 61],
      "rock-tunnel":     [82, 232, 197, 159,160,161,162,192, 226,227,228], // + Diglett's/Seafoam/Cerulean Cave
      "victory-road":    [108, 194, 198],
      "national-park":   [156, 217,218,219,220,221,222,223,224,225], // Safari Zone
      "ss-anne":         [95,96,97,98,99,100,101,102,103,104],
      "pokemon-center":  [41, 58, 64, 68, 81, 89, 133, 141, 154, 171, 182],
      "pokemon-gym":     [45, 54, 65, 92, 134, 157, 166, 178],
      "poke-mart":       [42, 56, 67, 91, 150, 152, 172, 180]
    };
    var RB_MAP = {};
    Object.keys(RB_AREAS).forEach(function(name){
      RB_AREAS[name].forEach(function(id){ RB_MAP[id] = RB_DIR + name + ".mp3"; });
    });
    // unmapped ids (houses, gates, labs...) return null: the current track
    // keeps playing, so stepping indoors doesn't cut the town music
    function rbResolve(map){
      return RB_MAP.hasOwnProperty(map) ? RB_MAP[map] : null;
    }
    var MUSIC_PACKS = {
      "pokemon-blue":   { addr:0xD35E, resolve:rbResolve },
      "pokemon-yellow": { addr:0xD35D, resolve:rbResolve }
    };

    var btn = document.getElementById("musicBtn");
    var pack = null;        // active pack for the inserted cart
    var channel = null;     // { ctx, gain } from AudioSystem
    var muted = false;
    var currentByte = -1;   // last map/music byte seen
    var currentUrl = null;  // track url now playing (or being loaded)
    var currentSrc = null;  // playing AudioBufferSourceNode
    var trackCache = {};    // url -> AudioBuffer

    try{ muted = localStorage.getItem("gbemu.music.muted") === "1"; }catch(err){}

    function renderBtn(){
      btn.hidden = !pack;
      btn.classList.toggle("muted", muted);
      btn.innerHTML = muted ? "&#9834;" : "&#9835;";
    }

    function applyGain(){
      if(channel) channel.gain.gain.value = muted ? 0 : 1;
    }

    function ensureChannel(){
      if(!channel) channel = AudioSystem.musicChannel();
      if(channel) applyGain();
      return channel;
    }

    function stopTrack(){
      if(currentSrc){
        try{ currentSrc.stop(); }catch(err){}
        currentSrc = null;
      }
      currentByte = -1;
      currentUrl = null;
    }

    /* follow the rom's map/music byte; distinct bytes can share a track
       (e.g. Route 1 -> Route 2), in which case playback continues */
    function setTrack(byte){
      if(!pack || byte === currentByte) return;
      currentByte = byte;
      var url = pack.resolve(byte);
      if(url === null) return; // unmapped map: let the current track carry on
      if(url === currentUrl) return;
      if(currentSrc){
        try{ currentSrc.stop(); }catch(err){}
        currentSrc = null;
      }
      currentUrl = url;
      if(!url) return;
      if(!ensureChannel()){
        // audio context not unlocked yet; retry on the next poll
        currentByte = -1; currentUrl = null;
        return;
      }
      loadTrack(url).then(function(buf){
        if(!buf || currentUrl !== url || currentSrc || !channel) return;
        var src = channel.ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.connect(channel.gain);
        src.start();
        currentSrc = src;
      });
    }

    function loadTrack(url){
      if(trackCache[url]) return Promise.resolve(trackCache[url]);
      return fetch(url).then(function(resp){
        if(!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.arrayBuffer();
      }).then(function(buf){
        return new Promise(function(resolve, reject){
          channel.ctx.decodeAudioData(buf, resolve, reject);
        });
      }).then(function(decoded){
        trackCache[url] = decoded;
        return decoded;
      }).catch(function(err){
        console.warn("custom music track failed", url, err);
        return null;
      });
    }

    function attach(cart){
      detach();
      pack = (cart && cart.id && MUSIC_PACKS[cart.id]) || null;
      renderBtn();
    }

    function detach(){
      stopTrack();
      pack = null;
      renderBtn();
    }

    /* per-frame hook: poll the pack's map/music byte and follow changes */
    function update(){
      if(!pack || !api.readMem || !gb) return;
      setTrack(api.readMem(gb, pack.addr));
    }

    function isActive(){
      return !!(pack && !muted);
    }

    /* true while a custom track is (or is about to be) audible; the game's
       native audio output is suppressed for the duration */
    function overriding(){
      return !!(pack && !muted && currentUrl);
    }

    btn.addEventListener("click", function(){
      muted = !muted;
      try{ localStorage.setItem("gbemu.music.muted", muted ? "1" : "0"); }catch(err){}
      applyGain();
      renderBtn();
      AudioSystem.playClick("pill");
    });

    renderBtn();
    return { attach:attach, detach:detach, update:update, isActive:isActive, overriding:overriding };
  })();

  /* ---------------- render + loop ---------------- */
  function renderFrame(){
    var ptr = fbPtr;
    var src = Module.HEAPU8.subarray(ptr, ptr + W*H);
    var data = imageData.data;
    for(var i=0;i<W*H;i++){
      var shade = src[i] & 3;
      var c = palette[shade];
      var o = i*4;
      data[o] = c[0]; data[o+1] = c[1]; data[o+2] = c[2];
    }
    ctx2d.putImageData(imageData, 0, 0);
  }

  var audioBufBytes = AUDIO_MAX_FRAMES * 2 * 4;
  function pumpAudio(){
    var n = api.readAudio(gb, audioPtr, AUDIO_MAX_FRAMES);
    if(n <= 0) return;
    if(speed !== 1) return; // off-speed: drain the core's buffer but stay silent
    if(CustomMusic.overriding()) return; // custom soundtrack replaces native audio
    var interleaved = Module.HEAPF32.subarray(audioPtr/4, audioPtr/4 + n*2);
    var L = new Float32Array(n), R = new Float32Array(n);
    for(var i=0;i<n;i++){ L[i] = interleaved[i*2]; R[i] = interleaved[i*2+1]; }
    AudioSystem.push(L, R, n);
  }

  var SPEEDS = [0.5, 1, 2, 5, Infinity];
  var speed = 1;

  var acc = 0, lastT = 0, rafId = 0;
  function loop(t){
    rafId = requestAnimationFrame(loop);
    if(!lastT) lastT = t;
    var dt = t - lastT;
    lastT = t;
    if(dt > 250) dt = 250; // tab was backgrounded; avoid a huge catch-up burst
    var frames = 0;
    if(speed === Infinity){
      // uncapped: run as many frames as fit in ~11ms, leaving time to render
      var budget = performance.now() + 11;
      while(performance.now() < budget){
        api.runFrame(gb);
        pumpAudio();
        frames++;
      }
      acc = 0;
    } else {
      acc += dt * speed;
      var cap = Math.max(MAX_CATCHUP_FRAMES, Math.ceil(speed) + 2);
      while(acc >= FRAME_MS && frames < cap){
        api.runFrame(gb);
        pumpAudio();
        acc -= FRAME_MS;
        frames++;
      }
      if(acc > FRAME_MS * cap) acc = FRAME_MS * cap;
    }
    if(frames > 0){
      renderFrame();
      CustomMusic.update();
    }
  }

  /* speed slider: snaps at x0.5, x1, x2, x5, MAX */
  (function(){
    var slider = document.getElementById("speedSlider");
    var label = document.getElementById("speedVal");
    slider.addEventListener("input", function(){
      speed = SPEEDS[slider.value | 0];
      label.textContent = speed === Infinity ? "MAX" : ("x" + speed);
    });
  })();

  /* ---------------- battery save ---------------- */
  function bytesToBase64(bytes){
    var CHUNK = 0x8000, parts = [];
    for(var i=0;i<bytes.length;i+=CHUNK){
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK)));
    }
    return btoa(parts.join(""));
  }
  function base64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function loadSaveIfPresent(){
    if(!hasBattery) return;
    var b64 = localStorage.getItem(saveKey());
    if(!b64) return;
    try{
      var bytes = base64ToBytes(b64);
      var ptr = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, ptr);
      api.loadSaveRam(gb, ptr, bytes.length);
      Module._free(ptr);
    }catch(err){
      console.warn("save load failed", err);
    }
  }

  function persistSave(){
    if(!hasBattery || !gb) return;
    var lenPtr = Module._malloc(4);
    Module.HEAPU32[lenPtr/4] = 0;
    var ptr = api.saveRam(gb, lenPtr);
    var len = Module.HEAPU32[lenPtr/4];
    Module._free(lenPtr);
    if(!ptr || !len) return;
    var bytes = Module.HEAPU8.subarray(ptr, ptr+len);
    try{
      localStorage.setItem(saveKey(), bytesToBase64(bytes));
    }catch(err){
      console.warn("save persist failed", err);
    }
  }

  setInterval(persistSave, SAVE_INTERVAL_MS);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") persistSave();
  });

  /* ---------------- run control ---------------- */
  var running = false;
  function pauseEmulation(){
    if(!running) return;
    running = false;
    cancelAnimationFrame(rafId);
  }
  function resumeEmulation(){
    if(running || !started) return;
    running = true;
    lastT = 0; acc = 0;
    rafId = requestAnimationFrame(loop);
  }
  /* first cart insertion doubles as the iOS audio-unlock gesture */
  var audioInited = false;
  function ensureAudio(){
    if(audioInited) return;
    audioInited = true;
    AudioSystem.init().then(function(){
      return AudioSystem.resume();
    }).catch(function(err){
      console.warn("audio init failed", err);
    });
  }

  /* gameplay screenshots double as the cartridge label art */
  function captureThumb(){
    if(!currentCart || !running) return;
    try{
      var t = document.createElement("canvas");
      t.width = 80; t.height = 72;
      t.getContext("2d").drawImage(canvas, 0, 0, 80, 72);
      localStorage.setItem("gbemu.thumb." + currentCart.file, t.toDataURL("image/jpeg", 0.65));
    }catch(err){}
  }
  setInterval(captureThumb, 20000);

  /* ---------------- cartridge dock ---------------- */
  var cartDock = document.getElementById("cartDock");
  var cartTab = document.getElementById("cartTab");
  var cartTray = document.getElementById("cartTray");
  var cartTitle = document.getElementById("cartTitle");

  function refreshCarts(){
    return fetch("carts.json", { cache:"no-store" }).then(function(resp){
      return resp.ok ? resp.json() : null;
    }).catch(function(){ return null; }).then(function(list){
      if(Array.isArray(list) && list.length){
        var valid = list.filter(function(c){ return c && c.file && c.title; });
        if(valid.length) CARTS = valid;
      }
    });
  }

  function fetchRomInto(file){
    return fetch("roms/" + encodeURIComponent(file)).then(function(resp){
      if(!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.arrayBuffer();
    }).then(function(buf){
      var romBytes = new Uint8Array(buf);
      var romPtr = Module._malloc(romBytes.length);
      Module.HEAPU8.set(romBytes, romPtr);
      var ok = api.loadRom(gb, romPtr, romBytes.length);
      Module._free(romPtr);
      if(!ok) throw new Error("gb_load_rom rejected " + file);
    });
  }

  var animTimer = 0;
  function ejectCart(){
    captureThumb();
    persistSave();
    pauseEmulation();
    currentCart = null;
    CustomMusic.detach();
    powerDot.classList.remove("playing");
    buttonState = 0; dpadState = 0; syncInput();
    // powered-off LCD
    ctx2d.fillStyle = "rgb(" + palette[0].join(",") + ")";
    ctx2d.fillRect(0, 0, W, H);
    // console (cart aboard) moves down, THEN cart pops out, THEN library opens
    clearTimeout(animTimer);
    document.body.classList.add("nocart");
    animTimer = setTimeout(function(){
      cartTab.classList.add("out");
      animTimer = setTimeout(function(){
        renderTray();
        cartDock.classList.add("open");
        // pick up newly added carts without a page reload
        refreshCarts().then(renderTray);
      }, 300);
    }, 520);
  }

  function insertCart(cart){
    return fetchRomInto(cart.file).then(function(){
      currentCart = cart;
      CustomMusic.attach(cart);
      cartTitle.textContent = cart.title;
      try{ localStorage.setItem("gbemu.lastCart", cart.file); }catch(err){}
      hasBattery = !!api.hasBattery(gb);
      loadSaveIfPresent();
      started = true;
      // library closes, cart slides INTO the slot, THEN console rises and powers on
      clearTimeout(animTimer);
      cartDock.classList.remove("open");
      animTimer = setTimeout(function(){
        cartTab.classList.remove("out");
        animTimer = setTimeout(function(){
          document.body.classList.remove("nocart");
          animTimer = setTimeout(function(){
            powerDot.classList.add("playing");
            resumeEmulation();
          }, 500);
        }, 320);
      }, 300);
    });
  }

  function cartImage(cart){
    if(cart.img) return cart.img;
    try{ return localStorage.getItem("gbemu.thumb." + cart.file); }catch(err){ return null; }
  }

  function renderTray(){
    cartTray.innerHTML = "";
    CARTS.forEach(function(cart){
      var item = document.createElement("button");
      item.className = "cart-item";
      item.innerHTML = '<span class="cart-grip"></span><span class="cart-sticker"><span class="cart-name"></span></span>';
      item.querySelector(".cart-name").textContent = cart.title;
      var src = cartImage(cart);
      if(src){
        var img = document.createElement("img");
        img.alt = "";
        img.src = src;
        item.querySelector(".cart-sticker").insertBefore(img, item.querySelector(".cart-name"));
      }
      item.addEventListener("pointerdown", function(e){
        startCartDrag(cart, item, e);
      });
      cartTray.appendChild(item);
    });
  }

  /* ---------------- cartridge dragging ----------------
     Grab a cart from the tray and drag it around; it tilts to face its
     direction of travel. Passing it over the slot opening inserts it. */
  var drag = null;

  function slotZone(){
    var r = document.querySelector(".cart-slot-lip").getBoundingClientRect();
    // generous hitbox around the thin lip
    return { left:r.left - 20, right:r.right + 20, top:r.top - 55, bottom:r.bottom + 45,
             cx:r.left + r.width / 2, cy:r.top + r.height / 2 };
  }

  function renderDrag(){
    drag.ghost.style.transform =
      "translate(" + drag.x + "px," + drag.y + "px) rotate(" + drag.rot + "deg)";
  }

  function startCartDrag(cart, item, e){
    if(drag || currentCart) return;
    ensureAudio();
    e.preventDefault();
    var rect = item.getBoundingClientRect();
    var ghost = item.cloneNode(true);
    ghost.classList.add("cart-ghost");
    ghost.classList.remove("drag-src");
    ghost.style.width = rect.width + "px";
    document.body.appendChild(ghost);
    item.classList.add("drag-src");
    document.body.classList.add("cart-dragging");
    drag = {
      cart:cart, item:item, ghost:ghost,
      x:rect.left, y:rect.top,
      offX:e.clientX - rect.left, offY:e.clientY - rect.top,
      rot:0, vx:0, vy:0, lastT:e.timeStamp, done:false
    };
    renderDrag();
    try{ item.setPointerCapture(e.pointerId); }catch(err){}
    item.addEventListener("pointermove", moveCartDrag);
    item.addEventListener("pointerup", releaseCartDrag);
    item.addEventListener("pointercancel", releaseCartDrag);
    requestAnimationFrame(dragTick);
  }

  /* runs every frame while dragging. Pendulum feel: the cart always wants
     to hang upright, and speed swings it toward the direction of travel —
     the faster it moves, the further from upright it tilts. */
  function dragTick(){
    if(!drag || drag.done) return;
    // no pointermove lately -> velocity bleeds off, cart rights itself
    if(performance.now() - drag.lastT > 60){ drag.vx *= 0.82; drag.vy *= 0.82; }
    var speed = Math.hypot(drag.vx, drag.vy); // px/ms
    var target = 0;
    if(speed > 0.02){
      var travel = Math.atan2(drag.vx, -drag.vy) * 180 / Math.PI; // -180..180
      // full alignment only at flick speed; capped so it never hangs upside down
      target = Math.max(-120, Math.min(120, travel * Math.min(1, speed / 0.9)));
    }
    var diff = ((target - drag.rot + 540) % 360) - 180;
    drag.rot += diff * 0.18;
    renderDrag();
    requestAnimationFrame(dragTick);
  }

  function detachDragListeners(d){
    d.item.removeEventListener("pointermove", moveCartDrag);
    d.item.removeEventListener("pointerup", releaseCartDrag);
    d.item.removeEventListener("pointercancel", releaseCartDrag);
    document.body.classList.remove("cart-dragging");
  }

  function moveCartDrag(e){
    if(!drag || drag.done) return;
    var nx = e.clientX - drag.offX, ny = e.clientY - drag.offY;
    var dt = Math.max(1, e.timeStamp - drag.lastT);
    // smoothed velocity (px/ms)
    drag.vx += ((nx - drag.x) / dt - drag.vx) * 0.3;
    drag.vy += ((ny - drag.y) / dt - drag.vy) * 0.3;
    drag.x = nx; drag.y = ny; drag.lastT = e.timeStamp;
    renderDrag();

    // cart center over the slot opening -> it goes in
    var z = slotZone();
    var g = drag.ghost;
    var cx = drag.x + g.offsetWidth / 2, cy = drag.y + g.offsetHeight / 2;
    if(cx > z.left && cx < z.right && cy > z.top && cy < z.bottom){
      dropCartIn(z);
    }
  }

  function dropCartIn(z){
    var d = drag;
    d.done = true;
    drag = null;
    detachDragListeners(d);
    var g = d.ghost;
    // straighten out and sink into the slot
    g.style.transition = "transform .3s cubic-bezier(.4,.8,.4,1), opacity .2s ease .15s";
    g.style.opacity = "0";
    g.style.transform = "translate(" + (z.cx - g.offsetWidth / 2) + "px," +
      (z.cy - g.offsetHeight / 3) + "px) rotate(0deg) scale(.72)";
    AudioSystem.playClick("btn");
    setTimeout(function(){ g.remove(); }, 380);
    insertCart(d.cart).then(function(){
      d.item.classList.remove("drag-src");
    }).catch(function(err){
      console.warn("cart load failed", err);
      d.item.classList.remove("drag-src");
      d.item.classList.add("err");
      setTimeout(function(){ d.item.classList.remove("err"); }, 900);
    });
  }

  function releaseCartDrag(){
    if(!drag || drag.done) return;
    var d = drag;
    drag = null;
    detachDragListeners(d);
    // float back to its spot in the tray
    var home = d.item.getBoundingClientRect();
    var g = d.ghost;
    g.style.transition = "transform .28s cubic-bezier(.3,1.3,.5,1)";
    g.style.transform = "translate(" + home.left + "px," + home.top + "px) rotate(0deg)";
    setTimeout(function(){
      g.remove();
      d.item.classList.remove("drag-src");
    }, 300);
  }

  cartTab.addEventListener("click", function(){
    if(!gb || !currentCart) return; // not booted / already empty
    AudioSystem.playClick("pill");
    ejectCart();
  });

  function boot(){
    if(typeof createGBCore !== "function"){
      showError("Core missing", "gbcore.js did not define createGBCore(). Make sure gbcore.js and gbcore.wasm sit next to index.html.");
      return;
    }
    createGBCore().then(function(mod){
      Module = mod;
      api.create = Module.cwrap("gb_create", "number", []);
      api.loadRom = Module.cwrap("gb_load_rom", "number", ["number","number","number"]);
      api.runFrame = Module.cwrap("gb_run_frame", null, ["number"]);
      api.framebuffer = Module.cwrap("gb_framebuffer", "number", ["number"]);
      api.setInput = Module.cwrap("gb_set_input", null, ["number","number","number"]);
      api.readAudio = Module.cwrap("gb_read_audio", "number", ["number","number","number"]);
      api.hasBattery = Module.cwrap("gb_has_battery", "number", ["number"]);
      api.saveRam = Module.cwrap("gb_save_ram", "number", ["number","number"]);
      api.loadSaveRam = Module.cwrap("gb_load_save_ram", "number", ["number","number","number"]);
      api.readMem = Module.cwrap("gb_read_mem", "number", ["number","number"]);

      return refreshCarts().then(function(){
        gb = api.create();
        if(!gb){ throw new Error("gb_create returned null"); }
        fbPtr = api.framebuffer(gb);
        audioPtr = Module._malloc(audioBufBytes);

        // boot to an empty console: pulled down, library open, no ROM loaded
        overlay.classList.add("hidden");
        ejectCart();
      });
    }).catch(function(err){
      console.error(err);
      showError("Startup failed", (err && err.message) ? err.message : String(err));
    });
  }

  boot();
})();
</script>
</body>
</html>
