name: iOS build (unsigned)

# Builds an unsigned .ipa of the Expo app for manual/testing distribution.
# Signing is intentionally disabled for now.
#
# Triggered by hand only ("Run workflow" in the Actions tab, or `gh workflow run
# ios-build.yml --ref <branch>`). A build is a deliberate action against a
# chosen ref rather than a side effect of landing app changes.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14
    env:
      EXPO_PUBLIC_BATTLE_LINK_URL: ${{ vars.BATTLE_LINK_URL }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"

      - name: Install CocoaPods
        run: pod install
        working-directory: app/ios

      - name: Resolve workspace and scheme
        id: xc
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          app_path=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -n 1)
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          (cd build && zip -qry app-unsigned.ipa Payload)
          ls -lh build/app-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeboy-ios-unsigned
          path: app/build/app-unsigned.ipa
          if-no-files-found: error

      - name: Publish LiveContainer install
        env:
          IPA_HOST_TOKEN: ${{ secrets.IPA_HOST_TOKEN }}
          IPA_HOST_URL: ${{ vars.IPA_HOST_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$IPA_HOST_TOKEN" ]]; then
            echo "The IPA_HOST_TOKEN repository secret is not configured." >&2
            exit 1
          fi

          ipa="build/app-unsigned.ipa"
          checksum="$(shasum -a 256 "$ipa" | cut -d ' ' -f 1)"
          response="$(
            curl --fail-with-body \
              --retry 3 \
              --retry-all-errors \
              --request PUT \
              --header "Authorization: Bearer $IPA_HOST_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --header "X-IPA-SHA256: $checksum" \
              --data-binary "@$ipa" \
              "$IPA_HOST_URL/api/builds/$GITHUB_SHA"
          )"

          install_url="$(
            printf '%s' "$response" |
              node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(r.install_url)'
          )"
          ipa_url="$(
            printf '%s' "$response" |
              node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(r.ipa_url)'
          )"

          {
            echo "### Pokeboy iOS build"
            echo
            echo "[Install in LiveContainer]($install_url)"
            echo
            echo "[Install page]($IPA_HOST_URL/) · [Direct IPA]($ipa_url)"
          } >> "$GITHUB_STEP_SUMMARY"
