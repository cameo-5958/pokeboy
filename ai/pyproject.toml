[project]
name = "pokeboy-ai"
version = "0.1.0"
description = "Pokeboy AI battle agent: simulator, data pipeline, model tiers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "huggingface_hub>=0.30",
    "requests>=2.32",
    "lz4>=4.4.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "data", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
