# Pokeboy web player — emulator.cameo.moe
#
# Same TLS pattern as the other *.cameo.moe vhosts: the host's stream{} router
# on :443 (ssl_preread) forwards HTTPS to 127.0.0.1:8443, and nginx selects
# this server block by SNI. Everything proxies to the Node backend
# (pokeboy-backend.service, loopback :4000), which serves the web shell at this
# hostname's root and gates play behind the web session login.
#
# Installed by setup-emulator-host.sh (run it with sudo).

server {
    listen 80;
    listen [::]:80;
    server_name emulator.cameo.moe;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name emulator.cameo.moe;

    ssl_certificate     /etc/letsencrypt/live/emulator.cameo.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emulator.cameo.moe/privkey.pem;

    # Save-state uploads are gzipped WASM heap snapshots — a few MB normally,
    # ~22 MB worst case when the browser lacks CompressionStream.
    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
